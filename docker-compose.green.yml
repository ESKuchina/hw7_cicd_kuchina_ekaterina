services:
  ml-service-green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-service-green
    environment:
      APP_VERSION: "v1.1.0"
      MODEL_VERSION: "v1.1.0"
      PORT: "8000"
    expose:
      - "8000"
    networks:
      - ml-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ml-net:
    name: ml-net

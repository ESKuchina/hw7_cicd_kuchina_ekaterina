name: Model Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ secrets.MODEL_VERSION }}"
          docker build -t ghcr.io/${{ github.repository }}:${IMAGE_TAG} .
          docker push ghcr.io/${{ github.repository }}:${IMAGE_TAG}

      - name: Deploy via API
        if: ${{ secrets.CLOUD_TOKEN != '' && vars.DEPLOY_URL != '' }}
        run: |
          curl -X POST "${{ vars.DEPLOY_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUD_TOKEN }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "image=ghcr.io/${{ github.repository }}:${{ secrets.MODEL_VERSION }}"

      - name: Deployment note
        if: ${{ secrets.CLOUD_TOKEN == '' || vars.DEPLOY_URL == '' }}
        run: |
          echo "Docker image was published to GHCR."
          echo "Deploy step was skipped because CLOUD_TOKEN or DEPLOY_URL is not configured."

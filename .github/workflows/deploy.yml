name: Model Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUD_TOKEN: ${{ secrets.CLOUD_TOKEN }}
      MODEL_VERSION: ${{ secrets.MODEL_VERSION }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${MODEL_VERSION} .
          docker push ghcr.io/${{ github.repository }}:${MODEL_VERSION}

      - name: Deploy via API
        if: ${{ env.CLOUD_TOKEN != '' && env.DEPLOY_URL != '' }}
        run: |
          curl -X POST "${DEPLOY_URL}" \
            -H "Authorization: Bearer ${CLOUD_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "image=ghcr.io/${{ github.repository }}:${MODEL_VERSION}"

      - name: Deployment note
        if: ${{ env.CLOUD_TOKEN == '' || env.DEPLOY_URL == '' }}
        run: |
          echo "Docker image was published to GHCR."
          echo "Deploy step was skipped because CLOUD_TOKEN or DEPLOY_URL is not configured."

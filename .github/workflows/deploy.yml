name: Model Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODEL_VERSION: ${{ secrets.MODEL_VERSION }}
      RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          docker build -t ${IMAGE_NAME}:${MODEL_VERSION} .
          docker push ${IMAGE_NAME}:${MODEL_VERSION}

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for service warm-up
        run: |
          sleep 60

      - name: Check /health
        run: |
          curl "${RENDER_APP_URL}/health"

      - name: Check /predict
        run: |
          curl -X POST "${RENDER_APP_URL}/predict" \
            -H "Content-Type: application/json" \
            -d '{"x":[1,2,3]}'
